[project]
name = "auto-pipeline"
version = "1.3.0"
description = "Agent-first pipeline and GPU kernel optimization toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AutoPipeline contributors" }]
keywords = ["gpu", "triton", "cuda", "kernelbench", "agents", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "torch>=2.4.0",
    "triton>=3.3.0",
]

[project.optional-dependencies]
# Model ingestion: profile and optimize any PyTorch model
models = [
    "transformers>=4.50.0",
    "accelerate>=1.5.0",
    "safetensors>=0.5.0",
]
# CUDA C++ backend: native CUDA kernel compilation (speeds up build from ~30s to ~5s)
cuda = [
    "ninja>=1.11.0",
]
# KernelBench integration: benchmark against 250+ standardized GPU kernel problems
kernelbench = [
    "datasets>=2.16.0",
]
# Advanced profiling: HTA, memory analysis
profiling = [
    "HolisticTraceAnalysis>=0.2.0",
]
# HuggingFace Kernels: export and distribute optimized kernels via the Hub
hf-kernels = [
    "kernels>=0.4.0",
    "huggingface-hub>=0.20.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/LyrineYang/Autopipeline"
Repository = "https://github.com/LyrineYang/Autopipeline"
Issues = "https://github.com/LyrineYang/Autopipeline/issues"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tree*", "kernelbench*", "pipeline*", "kernels*", "models*"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
