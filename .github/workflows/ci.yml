name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -e . --no-deps

      - name: Compile Python files
        run: python -m py_compile autopipeline/*.py tree/*.py kernelbench/*.py pipeline/*.py kernels/*.py kernels/cuda/*.py models/*.py scripts/*.py tests/*.py *.py

      - name: Smoke CLI
        run: |
          autopipeline --help
          autopipeline doctor --no-gpu
          autopipeline tree --help

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check whitespace
        run: git diff --check HEAD~1..HEAD

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w /tmp/autopipeline-wheel
