name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . --no-deps

      - name: Compile Python files
        run: python -m py_compile autopipeline/*.py tree/*.py kernelbench/*.py pipeline/*.py kernels/*.py kernels/cuda/*.py models/*.py scripts/*.py tests/*.py *.py

      - name: Smoke CLI
        run: |
          autopipeline --help
          autopipeline doctor --no-gpu
          autopipeline tree --help

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check whitespace
        run: git diff --check HEAD~1..HEAD

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w /tmp/autopipeline-wheel

      - name: Exercise installed wheel outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps /tmp/autopipeline-wheel/*.whl
          cd "$RUNNER_TEMP"
          autopipeline doctor --no-gpu
          autopipeline pipeline init wheel-workload
          autopipeline pipeline check --spec wheel-workload/pipeline.json --no-runtime

  cpu-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU compute stack and product
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[cpu,models]'
      - name: Execute actual model, profiler, rejection, and export checks
        run: |
          python -m unittest discover -s tests -p test_pipeline_product.py
          python -m unittest discover -s tests -p test_workload_examples.py
