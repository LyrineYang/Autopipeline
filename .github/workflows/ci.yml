name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile Python files
        run: python -m py_compile tree/*.py kernelbench/*.py pipeline/*.py scripts/*.py tests/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check whitespace
        run: git diff --check
