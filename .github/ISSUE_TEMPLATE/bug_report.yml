name: Bug report
description: Report a reproducible AutoPipeline issue.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, inputs, and the smallest example that reproduces the issue.
      placeholder: |
        python3 -m unittest discover -s tests
        uv run autopipeline tree run ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, GPU, CUDA/ROCm, PyTorch, Triton, and agent backend.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant traceback, command_status.json, stderr tail, or search_state.json excerpt.
      render: text
